name: Deploy showcase and docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build showcase
        run: pnpm --filter @holotope/showcase build

      # Generates the API reference from packages/*/src with typedoc, links it
      # to the showcase demos, then renders the VitePress site. Reads source
      # directly, so it does not require `pnpm build` or packages/*/dist.
      - name: Build docs
        run: pnpm --filter @holotope/docs build

      # One Pages artifact: showcase at the root, docs under /docs/.
      - name: Assemble site
        run: |
          mkdir -p site/docs
          cp -R examples/showcase/dist/. site/
          cp -R docs/.vitepress/dist/. site/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
