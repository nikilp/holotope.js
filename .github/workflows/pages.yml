name: Deploy showcase and docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build showcase
        run: pnpm --filter @holotope/showcase build

      # The API reference is generated from packages/*/src, but a name one
      # package re-exports or references from another resolves through that
      # package's `exports`, which point at its built declarations. Without
      # packages/*/dist TypeDoc drops @holotope/three's re-exports of
      # @holotope/core types without an error, and renders every cross-package
      # type as unlinked text, so the packages are built first, as `pnpm verify`
      # does.
      - name: Build packages
        run: pnpm build

      # Generates the API reference with typedoc, links it to the showcase
      # demos, then renders the VitePress site.
      - name: Build docs
        run: pnpm --filter @holotope/docs build

      # By name, not by count: every name a documented entry point re-exports
      # from another package, and every page the committed cross-package index
      # names, must have been built. A route check cannot see a page that
      # nothing links to.
      - name: Check the API reference is complete
        run: node scripts/check-api-pages.mjs

      # One Pages artifact: showcase at the root, docs under /docs/.
      - name: Assemble site
        run: |
          mkdir -p site/docs
          cp -R examples/showcase/dist/. site/
          cp -R docs/.vitepress/dist/. site/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
