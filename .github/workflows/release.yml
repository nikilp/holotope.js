name: Release

# Publishes the public @holotope packages to npm and creates the matching
# GitHub Release when a v* tag is pushed. Manual dispatch
# is an idempotent npm recovery path and does not manufacture an untagged
# GitHub Release. npm authenticates through trusted publishing (OIDC): no token
# is stored in the repository.
#
# A package that has never been published cannot be published from here.
# Trusted publishing attaches to an existing package, so the registry answers
# 404 for a name it has never seen. Bootstrapping is a one-time manual act:
# publish the first version locally with an npm account that may create the
# name, then configure this workflow as its trusted publisher on npmjs.com.
# Until then, dispatch with that package's include-* input set to false.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      include-physics:
        description: 'Publish @holotope/physics (disable for its one-time npm bootstrap)'
        type: boolean
        default: true
      include-experiment-physics:
        description: 'Publish @holotope/experiment-physics (disable for its one-time npm bootstrap)'
        type: boolean
        default: true
      include-experiment:
        description: 'Publish @holotope/experiment (disable for its one-time npm bootstrap)'
        type: boolean
        default: true

permissions:
  contents: write # Read sources and create the immutable tagged GitHub Release.
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tagged package versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for package in core experiment three physics experiment-physics; do
            actual=$(node -p "require('./packages/$package/package.json').version")
            if [[ "$actual" != "$expected" ]]; then
              echo "Tag $GITHUB_REF_NAME requires @holotope/$package@$expected, found $actual" >&2
              exit 1
            fi
          done

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest run

      - name: Publish
        # An explicit dependency order keeps first publication auditable. The
        # registry check makes manual dispatches and tag reruns idempotent.
        # pnpm packs workspace:* dependencies as real release versions. npm
        # then publishes that immutable tarball through trusted publishing;
        # packing first avoids repository-state checks on detached tag builds.
        shell: bash
        run: |
          # Established packages first. A package that has never been published
          # cannot be published by trusted publishing at all — there is no
          # package for the trusted publisher to attach to, so the registry
          # answers 404 until someone bootstraps it once by hand. Ordering a
          # never-published package early once cost an otherwise good release:
          # its bootstrap failure aborted the loop before two ready packages
          # were reached.
          packages=(core three)
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs['include-physics'] }}" == "true" ]]; then
            packages+=(physics)
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs['include-experiment'] }}" == "true" ]]; then
            packages+=(experiment)
          fi
          # Depends on core, experiment, and physics, so it publishes last.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs['include-experiment-physics'] }}" == "true" ]]; then
            packages+=(experiment-physics)
          fi
          for package in "${packages[@]}"; do
            directory="packages/$package"
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            tarball="$RUNNER_TEMP/$package-$version.tgz"
            pnpm --dir "$directory" pack --out "$tarball"
            npm publish "$tarball" --access public --provenance
          done

      # Keyed on the ref being a tag, not on how the run started. The intent
      # was never to create a Release for an untagged state; it was not to
      # leave a tagged one without a Release because a later step failed.
      # A publish failure once did exactly that, and nothing could then create
      # it: dispatch was excluded, and the tag already existed so it could not
      # be pushed again. Dispatching on the tag ref now recovers it.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; skipping"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
