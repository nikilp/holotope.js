name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build before typecheck: @holotope/three resolves @holotope/core
      # through its built dist.
      # `pnpm verify` is the single definition of this job, so a local run
      # is this job rather than a hand-assembled subset of it. Two CI
      # failures were caused by local runs that omitted a step listed only
      # here.
      #
      # What the documentation gates catch, which a successful build does not:
      #
      #   coverage  a newly exported symbol carrying no description; existing
      #             gaps are grandfathered in docs/doc-baseline.json, so the
      #             rule is that coverage may not regress
      #   guide     a link into repository source, or notation that no renderer
      #             reaches — \[ \] delimiters, a caret in frontmatter, or an
      #             exported options object TypeDoc would call __namedParameters
      #   routes    an internal link in the built site with no page behind it;
      #             sidebars and navigation exist only in rendered output, so a
      #             wrong target there repeats across every page it covers
      #
      # `routes` reads the built site, so the build runs first.
      - name: Verify
        run: pnpm verify
