name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build before typecheck: @holotope/three resolves @holotope/core
      # through its built dist.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build examples
        run: pnpm build:examples

      # Each of these fails on a defect that a successful build does not:
      #
      #   coverage  a newly exported symbol carrying no description; existing
      #             gaps are grandfathered in docs/doc-baseline.json, so the
      #             rule is that coverage may not regress
      #   guide     a link into repository source, or notation that no renderer
      #             reaches — \[ \] delimiters, or a caret in frontmatter
      #   routes    an internal link in the built site with no page behind it;
      #             sidebars and navigation exist only in rendered output, so a
      #             wrong target there repeats across every page it covers
      #
      # `routes` reads the built site, so the build runs first.
      - name: Documentation
        run: |
          pnpm --filter @holotope/docs build
          pnpm --filter @holotope/docs coverage
          pnpm --filter @holotope/docs guide
          pnpm --filter @holotope/docs routes
