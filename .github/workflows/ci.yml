name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build before typecheck: @holotope/three resolves @holotope/core
      # through its built dist.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build examples
        run: pnpm build:examples

      # Fails when a newly exported symbol carries no description. Existing
      # gaps are grandfathered in docs/doc-baseline.json, so this enforces
      # "coverage may not regress" rather than blocking on the backlog.
      - name: Documentation coverage
        run: |
          pnpm --filter @holotope/docs api
          pnpm --filter @holotope/docs coverage

      # Two classes of defect that build cleanly and only show on the deployed
      # site: a link into repository source (VitePress only validates markdown
      # routes), and raw notation — MathJax's \[ \] delimiters, or a caret
      # superscript in frontmatter, which no renderer ever sees.
      - name: Documentation guide checks
        run: pnpm --filter @holotope/docs guide
