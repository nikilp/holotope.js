<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holotope.js — Polytope browser</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        color: #8fa3c8;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 208px;
        padding: 10px 12px 12px;
        background: rgba(10, 10, 18, 0.82);
        border-left: 1px solid #1e2436;
        box-sizing: border-box;
        max-height: 100%;
        overflow-y: auto;
      }
      #panel h1 {
        margin: 0 0 8px;
        font-size: 12px;
        color: #d7e3ff;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 5px 0;
      }
      .row label {
        white-space: nowrap;
      }
      .row input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      .row output {
        color: #d7e3ff;
        min-width: 2.4em;
        text-align: right;
      }
      #stats {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #1e2436;
        color: #6f83a8;
      }
      #stats b {
        color: #d7e3ff;
        font-weight: 600;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: #ff9a9a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1 id="title">polytope</h1>
      <div id="controls"></div>
      <div id="stats"></div>
    </div>
    <div id="err"></div>
    <script type="module" src="/src/polytope-browser.ts"></script>
  </body>
</html>
