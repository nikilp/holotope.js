<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holotope.js — Flatland, honestly</title>
    <style>
      :root {
        --ground: #0c0e14;
        --raised: #141824;
        --rule: #232939;
        --ink: #e6e9f2;
        --ink-soft: #98a1b8;
        --ink-faint: #6b7488;
        --cut: #e0a34e;
        --cut-soft: rgba(224, 163, 78, 0.16);
        --solid: #6fb7c9;
        --ok: #7fd6a8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #stage {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        max-height: 100%;
      }

      /* ---------- header ---------- */
      header {
        display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
        padding: 14px 22px 10px;
        border-bottom: 1px solid var(--rule);
      }
      header h1 {
        margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
      }
      header .lede { margin: 0; color: var(--ink-soft); font-size: 13.5px; }
      header a { color: var(--solid); text-decoration: none; font-size: 12.5px; margin-left: auto; }
      header a:hover, header a:focus-visible { text-decoration: underline; }

      /* ---------- panes ---------- */
      #panes {
        display: grid; grid-template-columns: 1fr 1fr; min-height: 0;
      }
      /* Until the solid is revealed there is nothing in its pane, so the cuts
         take the whole stage rather than sharing it with an empty box. */
      #panes.guessing { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      #panes.guessing #solidPane { display: none; }
      /* Scene 6's two products are BOTH three-dimensional — a projection and a
         section — so there is no lower-dimensional view to put beside them, and
         the flat pane would only hold a stale picture from the scene before. */
      #panes.solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      #panes.solo #flatPane { display: none; }
      .pane { position: relative; min-height: 0; display: flex; flex-direction: column; }
      .pane + .pane { border-left: 1px solid var(--rule); }
      .pane h2 {
        margin: 0; padding: 9px 18px 0;
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--ink-faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #view { flex: 1; min-height: 0; }
      #view canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      #view canvas:active { cursor: grabbing; }
      #flat {
        flex: 1; min-height: 0; display: flex; align-items: center;
        justify-content: center; padding: 6px 18px 12px; overflow: hidden;
      }
      #flat > svg, #flat > .specimens { flex: 1; min-height: 0; width: 100%; height: 100%; touch-action: none; }

      .shape-name {
        position: absolute; left: 18px; bottom: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: var(--cut); letter-spacing: 0.06em;
      }
      .shape-name .dim { color: var(--ink-faint); }

      /* ---------- act copy ---------- */
      #act {
        border-top: 1px solid var(--rule);
        padding: 12px 22px 14px;
        display: grid; gap: 9px;
        background: var(--raised);
        max-height: 38vh; overflow-y: auto;
      }
      #act p { margin: 0; max-width: 74ch; color: var(--ink-soft); font-size: 14px; }
      #act p strong { color: var(--ink); font-weight: 600; }
      #act .lesson { color: var(--ok); }

      #choices { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        font: inherit; font-size: 13.5px; color: var(--ink);
        background: #1b2131; border: 1px solid var(--rule);
        border-radius: 7px; padding: 7px 14px; cursor: pointer;
        transition: border-color 120ms, background 120ms;
      }
      button:hover { border-color: var(--solid); }
      button:focus-visible { outline: 2px solid var(--solid); outline-offset: 2px; }
      button[disabled] { opacity: 0.45; cursor: default; }
      button.right { border-color: var(--ok); color: var(--ok); }
      button.wrong { border-color: #b4574d; color: #e08a80; }
      button.primary { background: #24304a; border-color: var(--solid); }

      /* ---------- scrub ---------- */
      #sceneNav { display: flex; gap: 6px; flex-wrap: wrap; }
      #sceneNav button {
        font-size: 12px; padding: 4px 11px; border-radius: 999px;
        background: transparent; color: var(--ink-faint);
      }
      #sceneNav button.active {
        color: var(--cut); border-color: var(--cut); background: #221a11;
      }

      #scrubRow, #hiddenRow { display: flex; align-items: center; gap: 14px; }
      #hiddenRow input { flex: 1; accent-color: var(--solid); height: 26px; }
      #hiddenRow input:focus-visible { outline: 2px solid var(--solid); outline-offset: 3px; }
      #scrubRow label, #hiddenRow label {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px; color: var(--ink-faint);
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      #offset { flex: 1; accent-color: var(--cut); height: 26px; }
      #offset:focus-visible { outline: 2px solid var(--solid); outline-offset: 3px; }
      #offsetValue {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px; color: var(--cut); min-width: 6ch; text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #provenance {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: var(--ink-faint); min-height: 1.3em;
      }
      #provenance b { color: var(--solid); font-weight: 400; }

      .hidden { display: none !important; }

      #view.waiting { opacity: 0; }
      #solidWait {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: var(--ink-faint); font-size: 13px; letter-spacing: 0.02em;
        pointer-events: none;
      }

      .specimens {
        display: flex; gap: clamp(8px, 3vw, 30px);
        align-items: stretch; justify-content: center;
        width: 100%; height: 100%; min-height: 0;
      }
      .specimens figure {
        margin: 0; flex: 1 1 0; min-width: 0; min-height: 0;
        display: flex; flex-direction: column; gap: 5px;
      }
      .specimens svg { flex: 1; min-height: 0; width: 100%; height: 100%; }
      .specimens figcaption {
        text-align: center; color: var(--ink-faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
      }

      @media (max-width: 820px) {
        #panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .pane + .pane { border-left: none; border-top: 1px solid var(--rule); }
        header .lede { display: none; }
      }
      /* Three cuts side by side stop being legible well before the phone does,
         so they stack and read as a sequence down the screen instead. */
      @media (max-width: 560px) {
        .specimens { flex-direction: column; gap: 4px; }
        .specimens figure { flex-direction: row; align-items: center; gap: 12px; }
        .specimens figcaption { flex: 0 0 4.5rem; text-align: left; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <header>
        <h1>The Cutting Plane</h1>
        <nav id="sceneNav" aria-label="Scenes"></nav>
        <a href="./index.html">← all examples</a>
      </header>

      <div id="panes">
        <section class="pane" id="solidPane" aria-label="The solid">
          <h2>The solid <span id="solidState">— hidden</span></h2>
          <div id="view"></div>
        </section>
        <section class="pane" id="flatPane" aria-label="The flat section">
          <h2>What the plane sees</h2>
          <div id="flat"></div>
          <div class="shape-name"><span id="shapeName">—</span> <span class="dim" id="shapeSides"></span></div>
        </section>
      </div>

      <div id="act">
        <p id="prompt"><strong>Three cuts of one solid, in order.</strong> Each is the flat shape
          where a plane met it. The solid never changed — only where the plane was.
          What was it?</p>
        <div id="choices"></div>
        <div id="scrubRow" class="hidden">
          <label for="offset">plane</label>
          <input id="offset" type="range" min="-1.74" max="1.74" step="0.005" value="-1.74"
                 aria-describedby="shapeName" />
          <span id="offsetValue">−1.740</span>
        </div>
        <div id="hiddenRow" class="hidden">
          <label for="xw">hidden x–w</label>
          <input id="xw" type="range" min="-1.5708" max="1.5708" step="0.01" value="0" />
          <label for="yw">y–w</label>
          <input id="yw" type="range" min="-1.5708" max="1.5708" step="0.01" value="0" />
        </div>
        <p id="provenance"></p>
      </div>
    </div>
    <script type="module" src="/src/flatland/index.ts"></script>
  </body>
</html>
